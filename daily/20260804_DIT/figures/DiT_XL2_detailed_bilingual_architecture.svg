<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2100" viewBox="0 0 3000 2100">
<defs><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#15222d;letter-spacing:0}.title{font-size:39px;font-weight:700}.sec{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.t{font-size:16px}.s{font-size:13px;fill:#425767}.xs{font-size:12px;fill:#586b78}.blue{fill:#e5f3fb;stroke:#0072b2;stroke-width:3}.orange{fill:#fff0cc;stroke:#e69f00;stroke-width:3}.green{fill:#dff4eb;stroke:#009e73;stroke-width:3}.gray{fill:#f1f4f6;stroke:#647985;stroke-width:2}.purple{fill:#efe7f7;stroke:#7b4fa3;stroke-width:3}.group{fill:#fff;stroke:#a4b0b7;stroke-width:2;stroke-dasharray:8 6}.blk{rx:7}.flow{fill:none;stroke:#263238;stroke-width:3;marker-end:url(#a)}.cond{fill:none;stroke:#007d61;stroke-width:3;marker-end:url(#ag)}.res{fill:none;stroke:#7b4fa3;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#ap)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#263238"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#007d61"/></marker><marker id="ap" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7b4fa3"/></marker></defs>
<rect width="3000" height="2100" fill="white"/><text x="1500" y="55" text-anchor="middle" class="title">DiT-XL/2 完整网络架构与数据流 / Detailed Network Architecture and Data Flow</text><text x="1500" y="88" text-anchor="middle" class="s">ImageNet 256×256 class-conditional configuration · latent patch transformer · adaLN-Zero conditioning</text>

<!-- A pipeline -->
<rect x="35" y="120" width="2930" height="510" class="group blk"/><text x="60" y="158" class="sec">A. 训练与采样总流程 / Training and Sampling Pipeline</text>
<rect x="70" y="235" width="160" height="95" class="gray blk"/><text x="150" y="267" text-anchor="middle" class="h">真实图像 x₀</text><text x="150" y="296" text-anchor="middle" class="t">256×256×3 RGB</text><text x="150" y="320" text-anchor="middle" class="s">training only</text>
<rect x="275" y="225" width="180" height="115" class="blue blk"/><text x="365" y="258" text-anchor="middle" class="h">Frozen VAE Encoder</text><text x="365" y="288" text-anchor="middle" class="t">E(x₀)=z₀</text><text x="365" y="317" text-anchor="middle" class="s">downsample factor 8</text>
<rect x="500" y="235" width="185" height="95" class="gray blk"/><text x="592" y="267" text-anchor="middle" class="h">干净 latent z₀</text><text x="592" y="296" text-anchor="middle" class="t">32×32×4</text><text x="592" y="320" text-anchor="middle" class="s">continuous latent</text>
<rect x="730" y="215" width="245" height="135" class="orange blk"/><text x="852" y="248" text-anchor="middle" class="h">Forward diffusion q</text><text x="852" y="280" text-anchor="middle" class="t">sample t∈[1,1000], ε~N(0,I)</text><text x="852" y="310" text-anchor="middle" class="t">z_t=√ᾱ_t z₀+√(1−ᾱ_t)ε</text><text x="852" y="337" text-anchor="middle" class="s">构造监督输入，不是网络层</text>
<rect x="1020" y="235" width="185" height="95" class="gray blk"/><text x="1112" y="267" text-anchor="middle" class="h">Noised latent z_t</text><text x="1112" y="296" text-anchor="middle" class="t">32×32×4</text><text x="1112" y="320" text-anchor="middle" class="s">training / sampling state</text>
<rect x="1250" y="185" width="925" height="235" class="blue blk"/><text x="1712" y="220" text-anchor="middle" class="h">DiT-XL/2 Denoiser εθ,Σθ(z_t,t,y) · 675M params · 118.6 GFLOPs</text><text x="1712" y="248" text-anchor="middle" class="s">patch size p=2 · N=28 blocks · hidden d=1152 · 16 heads · MLP ratio 4</text>
<rect x="1290" y="285" width="175" height="80" class="gray blk"/><text x="1377" y="315" text-anchor="middle" class="h">Patchify + Embed</text><text x="1377" y="343" text-anchor="middle" class="s">256 tokens ×1152</text>
<rect x="1510" y="275" width="180" height="100" class="green blk"/><text x="1600" y="307" text-anchor="middle" class="h">Condition MLP</text><text x="1600" y="336" text-anchor="middle" class="t">t + class y</text><text x="1600" y="360" text-anchor="middle" class="s">→ c ∈ R^1152</text>
<rect x="1735" y="270" width="190" height="110" class="blue blk"/><text x="1830" y="303" text-anchor="middle" class="h">28× DiT Block</text><text x="1830" y="333" text-anchor="middle" class="t">adaLN-Zero</text><text x="1830" y="358" text-anchor="middle" class="s">same token length</text>
<rect x="1970" y="275" width="170" height="100" class="purple blk"/><text x="2055" y="307" text-anchor="middle" class="h">Final Layer</text><text x="2055" y="336" text-anchor="middle" class="t">1152→32</text><text x="2055" y="360" text-anchor="middle" class="s">p²·2C</text>
<path d="M1205 282H1290M1465 325H1510M1690 325H1735M1925 325H1970" class="flow"/>
<rect x="2220" y="235" width="190" height="95" class="gray blk"/><text x="2315" y="267" text-anchor="middle" class="h">Unpatchify</text><text x="2315" y="296" text-anchor="middle" class="t">32×32×8</text><text x="2315" y="320" text-anchor="middle" class="s">ε prediction + Σ</text>
<rect x="2455" y="215" width="245" height="135" class="orange blk"/><text x="2577" y="248" text-anchor="middle" class="h">Loss / Reverse update</text><text x="2577" y="278" text-anchor="middle" class="t">L_simple=||εθ−ε||²</text><text x="2577" y="306" text-anchor="middle" class="t">+ learned variance L_vlb</text><text x="2577" y="334" text-anchor="middle" class="s">sampling: z_t → z_(t−1)</text>
<rect x="2745" y="225" width="175" height="115" class="blue blk"/><text x="2832" y="257" text-anchor="middle" class="h">VAE Decoder</text><text x="2832" y="286" text-anchor="middle" class="t">D(z₀)</text><text x="2832" y="314" text-anchor="middle" class="s">generated RGB</text>
<path d="M230 282H275M455 282H500M685 282H730M975 282H1020M1205 282H1250M2175 282H2220M2410 282H2455M2700 282H2745" class="flow"/>
<rect x="70" y="450" width="915" height="125" class="gray blk"/><text x="95" y="482" class="h">采样路径 / Sampling path</text><text x="95" y="514" class="t">从 z_T~N(0,I) 开始，不需要真实图像与 VAE Encoder；每个 timestep 重复调用同一个 DiT denoiser。</text><text x="95" y="545" class="t">Classifier-free guidance: ε_cfg=ε_uncond+s(ε_cond−ε_uncond)，论文仅对 latent 前 3 个通道施加 guidance。</text>
<path d="M2577 350V455Q2577 480 1112 480V330" class="res"/>

<!-- B tokenization -->
<rect x="35" y="660" width="875" height="610" class="group blk"/><text x="60" y="698" class="sec">B. Patchify 与条件编码 / Tokenization</text>
<rect x="75" y="760" width="190" height="115" class="gray blk"/><text x="170" y="793" text-anchor="middle" class="h">z_t spatial latent</text><text x="170" y="823" text-anchor="middle" class="t">32×32×4</text><text x="170" y="850" text-anchor="middle" class="s">VAE compressed image</text>
<rect x="315" y="735" width="250" height="165" class="orange blk"/><text x="440" y="768" text-anchor="middle" class="h">Conv2d Patch Embed</text><text x="440" y="800" text-anchor="middle" class="t">kernel=2, stride=2</text><text x="440" y="830" text-anchor="middle" class="t">4 input ch → 1152 hidden</text><text x="440" y="860" text-anchor="middle" class="s">每个 2×2×4 patch 映射为一个 token</text><text x="440" y="884" text-anchor="middle" class="s">为什么：复用 ViT，p 控制 token 预算</text>
<rect x="615" y="750" width="250" height="135" class="blue blk"/><text x="740" y="783" text-anchor="middle" class="h">Image token sequence X</text><text x="740" y="815" text-anchor="middle" class="t">16×16=256 tokens</text><text x="740" y="845" text-anchor="middle" class="t">X ∈ R^(256×1152)</text><text x="740" y="870" text-anchor="middle" class="s">+ fixed 2D sin-cos position</text>
<path d="M265 817H315M565 817H615" class="flow"/>
<rect x="75" y="960" width="210" height="115" class="gray blk"/><text x="180" y="993" text-anchor="middle" class="h">Timestep t</text><text x="180" y="1023" text-anchor="middle" class="t">256-d frequency embed</text><text x="180" y="1050" text-anchor="middle" class="s">表示噪声强度</text>
<rect x="75" y="1110" width="210" height="100" class="gray blk"/><text x="180" y="1143" text-anchor="middle" class="h">Class label y</text><text x="180" y="1173" text-anchor="middle" class="t">learned embedding</text><text x="180" y="1197" text-anchor="middle" class="s">10% dropout → null class</text>
<rect x="335" y="955" width="230" height="125" class="green blk"/><text x="450" y="988" text-anchor="middle" class="h">Timestep MLP</text><text x="450" y="1018" text-anchor="middle" class="t">256→1152→1152</text><text x="450" y="1047" text-anchor="middle" class="s">SiLU activation</text>
<rect x="335" y="1110" width="230" height="100" class="green blk"/><text x="450" y="1143" text-anchor="middle" class="h">Label Embedder</text><text x="450" y="1173" text-anchor="middle" class="t">y→R^1152</text><text x="450" y="1197" text-anchor="middle" class="s">supports CFG</text>
<rect x="615" y="1000" width="250" height="145" class="green blk"/><text x="740" y="1033" text-anchor="middle" class="h">Condition vector c</text><text x="740" y="1065" text-anchor="middle" class="t">c=t_embed+y_embed</text><text x="740" y="1095" text-anchor="middle" class="t">c ∈ R^1152</text><text x="740" y="1123" text-anchor="middle" class="s">同一条件调制所有 image tokens</text>
<path d="M285 1017H335M285 1160H335M565 1017L615 1050M565 1160L615 1100" class="cond"/>

<!-- C block -->
<rect x="940" y="660" width="2025" height="610" class="group blk"/><text x="965" y="698" class="sec">C. 单个 adaLN-Zero DiT Block（重复 28 次）/ One Block in Detail</text>
<rect x="985" y="770" width="180" height="90" class="blue blk"/><text x="1075" y="804" text-anchor="middle" class="h">Input X_l</text><text x="1075" y="834" text-anchor="middle" class="t">256×1152</text>
<rect x="985" y="1045" width="180" height="90" class="green blk"/><text x="1075" y="1078" text-anchor="middle" class="h">Condition c</text><text x="1075" y="1108" text-anchor="middle" class="t">1×1152</text>
<rect x="1220" y="1020" width="290" height="145" class="green blk"/><text x="1365" y="1053" text-anchor="middle" class="h">adaLN-Zero modulation MLP</text><text x="1365" y="1085" text-anchor="middle" class="t">SiLU → Linear 1152→6912</text><text x="1365" y="1115" text-anchor="middle" class="t">split into 6 vectors, each 1152</text><text x="1365" y="1143" text-anchor="middle" class="s">final Linear zero-initialized</text>
<rect x="1570" y="1025" width="400" height="135" class="purple blk"/><text x="1770" y="1058" text-anchor="middle" class="h">(β₁, γ₁, α₁, β₂, γ₂, α₂)</text><text x="1770" y="1090" text-anchor="middle" class="t">shift, scale, residual gate for MSA</text><text x="1770" y="1120" text-anchor="middle" class="t">shift, scale, residual gate for MLP</text><text x="1770" y="1145" text-anchor="middle" class="s">初始化为 0 → block 初始是 identity</text>
<path d="M1165 1090H1220M1510 1090H1570" class="cond"/>
<rect x="1220" y="745" width="210" height="95" class="gray blk"/><text x="1325" y="778" text-anchor="middle" class="h">LayerNorm</text><text x="1325" y="808" text-anchor="middle" class="t">no affine</text>
<rect x="1480" y="735" width="260" height="115" class="green blk"/><text x="1610" y="767" text-anchor="middle" class="h">Adaptive modulation 1</text><text x="1610" y="800" text-anchor="middle" class="t">X̂=(1+γ₁)⊙LN(X)+β₁</text><text x="1610" y="830" text-anchor="middle" class="s">condition enters without extra tokens</text>
<rect x="1790" y="725" width="260" height="135" class="orange blk"/><text x="1920" y="758" text-anchor="middle" class="h">Multi-Head Self-Attention</text><text x="1920" y="790" text-anchor="middle" class="t">Q,K,V:1152→1152</text><text x="1920" y="820" text-anchor="middle" class="t">16 heads ×72 dim</text><text x="1920" y="848" text-anchor="middle" class="s">global interaction among 256 tokens</text>
<rect x="2100" y="745" width="205" height="95" class="purple blk"/><text x="2202" y="778" text-anchor="middle" class="h">Gate α₁</text><text x="2202" y="808" text-anchor="middle" class="t">X'=X+α₁⊙MSA</text>
<rect x="2355" y="745" width="195" height="95" class="gray blk"/><text x="2452" y="778" text-anchor="middle" class="h">LayerNorm</text><text x="2452" y="808" text-anchor="middle" class="t">no affine</text>
<rect x="2600" y="735" width="300" height="115" class="green blk"/><text x="2750" y="767" text-anchor="middle" class="h">Adaptive modulation 2</text><text x="2750" y="800" text-anchor="middle" class="t">X̃=(1+γ₂)⊙LN(X')+β₂</text><text x="2750" y="830" text-anchor="middle" class="s">second condition injection</text>
<rect x="2355" y="910" width="240" height="130" class="orange blk"/><text x="2475" y="943" text-anchor="middle" class="h">Pointwise MLP</text><text x="2475" y="975" text-anchor="middle" class="t">1152→4608→1152</text><text x="2475" y="1005" text-anchor="middle" class="t">GELU(tanh approx)</text><text x="2475" y="1030" text-anchor="middle" class="s">token-wise channel mixing</text>
<rect x="2650" y="920" width="220" height="110" class="purple blk"/><text x="2760" y="953" text-anchor="middle" class="h">Gate α₂ + residual</text><text x="2760" y="985" text-anchor="middle" class="t">X_(l+1)=X'+α₂⊙MLP</text><text x="2760" y="1013" text-anchor="middle" class="s">same shape 256×1152</text>
<path d="M1165 815H1220M1430 792H1480M1740 792H1790M2050 792H2100M2305 792H2355M2550 792H2600M2750 850V885H2475V910M2595 975H2650" class="flow"/>
<path d="M1770 1025Q1770 900 1610 850M1770 1025Q2050 920 2202 840M1770 1025Q2450 1160 2750 850M1770 1025Q2500 1220 2760 1030" class="cond"/>
<path d="M1075 860Q1075 910 2202 910V840" class="res"/>

<!-- D final and why -->
<rect x="35" y="1305" width="1450" height="700" class="group blk"/><text x="60" y="1343" class="sec">D. Final Layer 与输出 / Output Head</text>
<rect x="75" y="1430" width="190" height="95" class="blue blk"/><text x="170" y="1463" text-anchor="middle" class="h">X_28</text><text x="170" y="1493" text-anchor="middle" class="t">256×1152</text>
<rect x="315" y="1415" width="250" height="125" class="green blk"/><text x="440" y="1448" text-anchor="middle" class="h">Final adaLN</text><text x="440" y="1480" text-anchor="middle" class="t">(1+γ_f)⊙LN(X)+β_f</text><text x="440" y="1510" text-anchor="middle" class="s">β_f,γ_f from condition c</text>
<rect x="615" y="1415" width="250" height="125" class="purple blk"/><text x="740" y="1448" text-anchor="middle" class="h">Linear decoder</text><text x="740" y="1480" text-anchor="middle" class="t">1152→p²·2C=32</text><text x="740" y="1510" text-anchor="middle" class="s">zero-initialized output layer</text>
<rect x="915" y="1415" width="235" height="125" class="gray blk"/><text x="1032" y="1448" text-anchor="middle" class="h">Unpatchify</text><text x="1032" y="1480" text-anchor="middle" class="t">256×32 → 32×32×8</text><text x="1032" y="1510" text-anchor="middle" class="s">restore spatial layout</text>
<rect x="1200" y="1405" width="235" height="145" class="orange blk"/><text x="1317" y="1438" text-anchor="middle" class="h">Two outputs</text><text x="1317" y="1470" text-anchor="middle" class="t">εθ: 4 channels</text><text x="1317" y="1500" text-anchor="middle" class="t">Σθ: 4 channels</text><text x="1317" y="1528" text-anchor="middle" class="s">mean/noise + learned covariance</text>
<path d="M265 1477H315M565 1477H615M865 1477H915M1150 1477H1200" class="flow"/>
<rect x="75" y="1610" width="1360" height="320" class="gray blk"/><text x="100" y="1645" class="h">为什么这样设计 / Design rationale</text><text x="100" y="1685" class="t">1. Latent space：把 256×256 RGB 压到 32×32×4，使全局 self-attention 可承受，同时复用成熟 LDM pipeline。</text><text x="100" y="1725" class="t">2. Patch size p：不改变主体参数量，却改变 token 数和 GFLOPs；p 从 8→4→2 时，每次 token 数约 ×4，质量持续提高。</text><text x="100" y="1765" class="t">3. Pure Transformer：去掉 U-Net 的卷积多尺度归纳偏置，验证标准 ViT backbone 也能成为强 diffusion denoiser。</text><text x="100" y="1805" class="t">4. adaLN：条件向量只产生每通道 shift/scale，额外计算极少，比 cross-attention 约 15% overhead 更经济。</text><text x="100" y="1845" class="t">5. Zero initialization：α 与 final decoder 初始为 0，使每个残差块近似 identity，深网络训练初期更稳定。</text><text x="100" y="1885" class="t">6. Predict ε and Σ：ε 用简单 MSE 学反向均值，Σ 用 variational bound 学反向方差，继承 Improved DDPM 设置。</text>

<rect x="1525" y="1305" width="1440" height="700" class="group blk"/><text x="1550" y="1343" class="sec">E. 模型族、复杂度与解释 / Model Family</text>
<rect x="1570" y="1410" width="620" height="310" class="blue blk"/><text x="1880" y="1445" text-anchor="middle" class="h">Transformer size configurations</text><text x="1610" y="1490" class="t">DiT-S:  N=12, d=384,  heads=6,  ~33M params</text><text x="1610" y="1530" class="t">DiT-B:  N=12, d=768,  heads=12, ~130M params</text><text x="1610" y="1570" class="t">DiT-L:  N=24, d=1024, heads=16, ~458M params</text><text x="1610" y="1610" class="t">DiT-XL: N=28, d=1152, heads=16, ~675M params</text><text x="1610" y="1660" class="s">命名 DiT-XL/2 = XL backbone + latent patch size 2</text><text x="1610" y="1690" class="s">参数量主要由 N,d 决定；patch size 主要改变 token/FLOPs。</text>
<rect x="2240" y="1410" width="675" height="310" class="orange blk"/><text x="2577" y="1445" text-anchor="middle" class="h">256×256 forward GFLOPs / FID at 400K</text><text x="2280" y="1490" class="t">S/8 0.36G → FID 153.60    | S/2 6.06G → 68.40</text><text x="2280" y="1530" class="t">B/8 1.42G → 122.74    | B/2 23.01G → 43.47</text><text x="2280" y="1570" class="t">L/8 5.01G → 118.87    | L/2 80.71G → 23.33</text><text x="2280" y="1610" class="t">XL/8 7.39G → 106.41   | XL/2 118.64G → 19.47</text><text x="2280" y="1660" class="s">论文观察：GFLOPs 与 FID 的相关系数约 -0.93。</text><text x="2280" y="1690" class="s">结论不是“参数越多越好”，而是有效 forward compute 越高越好。</text>
<rect x="1570" y="1770" width="1345" height="160" class="gray blk"/><text x="1600" y="1805" class="h">阅读边界 / Important boundary</text><text x="1600" y="1845" class="t">DiT 论文证明的是：在固定的 class-conditional ImageNet latent-diffusion setting 中，标准 Transformer 具有清晰 scaling behavior。</text><text x="1600" y="1885" class="t">它没有证明 U-Net 在所有数据规模、所有条件类型和所有延迟预算下都应被替换；FID 也不能单独代表语义忠实度与多样性。</text>
<text x="1500" y="2070" text-anchor="middle" class="xs">Source: Peebles &amp; Xie, “Scalable Diffusion Models with Transformers,” ICCV 2023 / arXiv:2212.09748v2. Diagram redrawn for study and implementation understanding.</text>
</svg>
