<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill:#17202a; letter-spacing:0; }
      .title { font-size:32px; font-weight:700; }
      .section { font-size:20px; font-weight:700; }
      .h { font-size:18px; font-weight:700; }
      .t { font-size:15px; }
      .s { font-size:13px; fill:#34495e; }
      .box { stroke:#253746; stroke-width:2; rx:6; }
      .frozen { fill:#d9effa; stroke:#0072b2; }
      .train { fill:#fff0cc; stroke:#e69f00; }
      .fusion { fill:#d9f3e9; stroke:#009e73; }
      .latent { fill:#edf1f4; stroke:#6c7a89; }
      .input { fill:#f8f9fa; stroke:#455a64; }
      .flow { fill:none; stroke:#263238; stroke-width:2.5; marker-end:url(#arrow); }
      .inject { fill:none; stroke:#8e5a00; stroke-width:2.5; stroke-dasharray:8 6; marker-end:url(#arrowOrange); }
      .textflow { fill:none; stroke:#00755b; stroke-width:2.5; marker-end:url(#arrowGreen); }
      .group { fill:#fff; stroke:#abb7b7; stroke-width:1.5; stroke-dasharray:6 5; rx:8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#263238"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#8e5a00"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#00755b"/></marker>
  </defs>

  <rect width="1920" height="1180" fill="#ffffff"/>
  <text x="960" y="48" text-anchor="middle" class="title">DreamSR 完整网络架构 / Complete Network Architecture</text>
  <text x="960" y="76" text-anchor="middle" class="s">先一步去除退化，再以全局语义与局部 patch 约束进行 16 步纹理生成</text>

  <rect x="35" y="100" width="350" height="1020" class="group"/>
  <rect x="405" y="100" width="390" height="1020" class="group"/>
  <rect x="815" y="100" width="850" height="1020" class="group"/>
  <rect x="1685" y="100" width="200" height="1020" class="group"/>
  <text x="55" y="132" class="section">A  输入与条件</text><text x="55" y="155" class="s">Inputs &amp; Conditions</text>
  <text x="425" y="132" class="section">B  阶段一：去退化</text><text x="425" y="155" class="s">Stage 1: Degradation Removal</text>
  <text x="835" y="132" class="section">C  阶段二：纹理生成</text><text x="835" y="155" class="s">Stage 2: Texture Generation</text>
  <text x="1705" y="132" class="section">D  输出</text><text x="1705" y="155" class="s">Output</text>

  <!-- Input and prompt extraction -->
  <rect x="75" y="455" width="130" height="92" class="box input"/>
  <text x="140" y="486" text-anchor="middle" class="h">低清图像</text><text x="140" y="512" text-anchor="middle" class="t">I_LQ</text><text x="140" y="534" text-anchor="middle" class="s">Low-quality image</text>
  <rect x="235" y="455" width="120" height="92" class="box frozen"/>
  <text x="295" y="486" text-anchor="middle" class="h">FLUX VAE</text><text x="295" y="510" text-anchor="middle" class="t">Encoder</text><text x="295" y="533" text-anchor="middle" class="s">冻结 / Frozen</text>
  <path d="M205 501 H235" class="flow"/>

  <rect x="75" y="205" width="130" height="70" class="box frozen"/>
  <text x="140" y="236" text-anchor="middle" class="h">LLaVA</text><text x="140" y="260" text-anchor="middle" class="s">冻结 / Frozen</text>
  <path d="M140 455 V275" class="flow"/>
  <rect x="230" y="185" width="135" height="76" class="box latent"/>
  <text x="297" y="214" text-anchor="middle" class="h">全局提示</text><text x="297" y="238" text-anchor="middle" class="t">P_global</text><text x="297" y="256" text-anchor="middle" class="s">Global prompt</text>
  <rect x="230" y="290" width="135" height="76" class="box latent"/>
  <text x="297" y="319" text-anchor="middle" class="h">局部提示</text><text x="297" y="343" text-anchor="middle" class="t">P_patch^(i,j)</text><text x="297" y="361" text-anchor="middle" class="s">Patch prompts</text>
  <path d="M205 230 H230" class="flow"/><path d="M205 245 Q220 245 220 328 H230" class="flow"/>
  <rect x="85" y="620" width="260" height="120" class="box input"/>
  <text x="215" y="650" text-anchor="middle" class="h">分块推理 / Patch-wise inference</text>
  <g stroke="#607d8b" fill="#eef3f5"><rect x="150" y="670" width="36" height="30"/><rect x="187" y="670" width="36" height="30"/><rect x="224" y="670" width="36" height="30"/><rect x="150" y="701" width="36" height="30"/><rect x="187" y="701" width="36" height="30" fill="#ffd27a"/><rect x="224" y="701" width="36" height="30"/></g>
  <text x="282" y="704" class="s">逐 patch 恢复</text><text x="282" y="724" class="s">并重新拼接</text>

  <!-- Stage 1 -->
  <rect x="435" y="455" width="130" height="92" class="box latent"/>
  <text x="500" y="486" text-anchor="middle" class="h">低清 latent</text><text x="500" y="513" text-anchor="middle" class="t">z_LQ</text>
  <path d="M355 501 H435" class="flow"/>
  <rect x="590" y="360" width="175" height="285" class="box frozen"/>
  <text x="677" y="394" text-anchor="middle" class="h">FLUX DiT 主干</text><text x="677" y="419" text-anchor="middle" class="s">FLUX DiT Backbone</text>
  <rect x="610" y="445" width="135" height="65" class="box frozen"/>
  <text x="677" y="472" text-anchor="middle" class="t">原始权重 W</text><text x="677" y="495" text-anchor="middle" class="s">冻结 / Frozen</text>
  <text x="677" y="538" text-anchor="middle" class="h">＋</text>
  <rect x="610" y="555" width="135" height="65" class="box train"/>
  <text x="677" y="580" text-anchor="middle" class="t">Restoration LoRA</text><text x="677" y="600" text-anchor="middle" class="s">ΔW=BA · rank=256</text><text x="677" y="617" text-anchor="middle" class="s">可训练 / Trainable</text>
  <path d="M565 501 H590" class="flow"/>
  <rect x="470" y="700" width="280" height="105" class="box train"/>
  <text x="610" y="731" text-anchor="middle" class="h">1 step：一步去退化</text><text x="610" y="757" text-anchor="middle" class="t">移除 blur / noise / compression artifacts</text><text x="610" y="783" text-anchor="middle" class="s">LoRA 是主干内部的增量参数，不是独立串联网络</text>

  <!-- Transition -->
  <rect x="840" y="455" width="145" height="92" class="box latent"/>
  <text x="912" y="485" text-anchor="middle" class="h">去退化 latent</text><text x="912" y="512" text-anchor="middle" class="t">z_dr</text><text x="912" y="534" text-anchor="middle" class="s">clean structure</text>
  <path d="M765 501 H840" class="flow"/>
  <rect x="1010" y="445" width="170" height="112" class="box latent"/>
  <text x="1095" y="474" text-anchor="middle" class="h">加噪 / Noise injection</text><text x="1095" y="505" text-anchor="middle" class="t">z_t=(1−t)z_dr+tε</text><text x="1095" y="533" text-anchor="middle" class="s">跳过冗余的早期去噪</text>
  <path d="M985 501 H1010" class="flow"/>

  <!-- Stage 2 frozen backbone -->
  <rect x="1210" y="285" width="410" height="350" class="box frozen"/>
  <text x="1415" y="320" text-anchor="middle" class="h">冻结的 FLUX DiT / Frozen FLUX DiT</text>
  <text x="1415" y="345" text-anchor="middle" class="s">输入：z_t^(i,j) + timestep + P_global</text>
  <rect x="1245" y="385" width="155" height="135" class="box frozen"/>
  <text x="1322" y="417" text-anchor="middle" class="h">MM-DiT Blocks</text><text x="1322" y="447" text-anchor="middle" class="t">Image tokens</text><text x="1322" y="471" text-anchor="middle" class="t">＋ Text tokens</text><text x="1322" y="500" text-anchor="middle" class="s">多模态交互</text>
  <rect x="1440" y="385" width="145" height="135" class="box frozen"/>
  <text x="1512" y="417" text-anchor="middle" class="h">Single-DiT</text><text x="1512" y="445" text-anchor="middle" class="t">Joint tokens</text><text x="1512" y="474" text-anchor="middle" class="s">联合 token 精炼</text>
  <path d="M1400 452 H1440" class="flow"/>
  <text x="1415" y="565" text-anchor="middle" class="h">强生成先验：负责“会画”</text><text x="1415" y="591" text-anchor="middle" class="t">保持全局语义与跨 patch 一致性</text>
  <text x="1415" y="615" text-anchor="middle" class="s">16-step texture generation</text>
  <path d="M1180 501 H1210" class="flow"/>
  <path d="M365 223 H1160 Q1190 223 1190 350 H1260" class="textflow"/>
  <text x="795" y="211" class="s" fill="#00755b">Global prompt → 主生成分支</text>

  <!-- ControlNet branch -->
  <rect x="930" y="755" width="410" height="275" class="box train"/>
  <text x="1135" y="788" text-anchor="middle" class="h">Patch Context-aware MM-ControlNet</text>
  <text x="1135" y="813" text-anchor="middle" class="s">可训练 / Trainable · 仅复制 FLUX 的 MM-DiT blocks</text>
  <text x="1135" y="836" text-anchor="middle" class="s">不包含 Single-DiT blocks · layers l=1…9</text>
  <rect x="955" y="865" width="160" height="90" class="box latent"/>
  <text x="1035" y="894" text-anchor="middle" class="t">低清 patch latent</text><text x="1035" y="920" text-anchor="middle" class="t">z_LQ^(i,j)</text><text x="1035" y="943" text-anchor="middle" class="s">视觉结构条件</text>
  <rect x="1140" y="865" width="170" height="90" class="box latent"/>
  <text x="1225" y="894" text-anchor="middle" class="t">局部提示</text><text x="1225" y="920" text-anchor="middle" class="t">P_patch^(i,j)</text><text x="1225" y="943" text-anchor="middle" class="s">局部语义条件</text>
  <path d="M365 328 H890 Q910 328 910 910 H930" class="textflow"/>
  <path d="M500 547 V690 Q500 720 900 720 Q915 720 955 865" class="flow"/>

  <rect x="1370" y="760" width="225" height="105" class="box train"/>
  <text x="1482" y="790" text-anchor="middle" class="h">图像控制特征</text><text x="1482" y="815" text-anchor="middle" class="t">f_c,img^l → Zero-MLP</text><text x="1482" y="842" text-anchor="middle" class="s">约束边缘、形状与局部结构</text>
  <path d="M1340 835 H1370" class="flow"/>
  <path d="M1482 760 V540 H1322" class="inject"/>
  <text x="1492" y="690" class="s" fill="#8e5a00">image feature injection</text>

  <rect x="1370" y="910" width="225" height="120" class="box fusion"/>
  <text x="1482" y="941" text-anchor="middle" class="h">Context Cross-Attention</text>
  <text x="1482" y="970" text-anchor="middle" class="t">Q = global text</text><text x="1482" y="994" text-anchor="middle" class="t">K,V = local text</text><text x="1482" y="1018" text-anchor="middle" class="s">→ Text MLP → 文本流注入</text>
  <path d="M1340 950 H1370" class="textflow"/>
  <path d="M1595 970 H1635 V365 H1370" class="textflow"/>
  <text x="1400" y="1065" class="s">融合 global + local semantics：抑制 over-generation 与 patch inconsistency</text>

  <!-- Output -->
  <rect x="1705" y="390" width="160" height="105" class="box frozen"/>
  <text x="1785" y="423" text-anchor="middle" class="h">FLUX VAE</text><text x="1785" y="450" text-anchor="middle" class="t">Decoder</text><text x="1785" y="477" text-anchor="middle" class="s">冻结 / Frozen</text>
  <rect x="1705" y="555" width="160" height="115" class="box input"/>
  <text x="1785" y="588" text-anchor="middle" class="h">超高分辨率图像</text><text x="1785" y="617" text-anchor="middle" class="t">Ultra-high-resolution</text><text x="1785" y="643" text-anchor="middle" class="s">faithful structure + details</text>
  <path d="M1620 452 H1705" class="flow"/><path d="M1785 495 V555" class="flow"/>

  <!-- Legend -->
  <rect x="65" y="900" width="730" height="180" class="box input"/>
  <text x="90" y="932" class="h">图例与模块职责 / Legend &amp; Roles</text>
  <rect x="90" y="955" width="28" height="20" class="frozen"/><text x="130" y="971" class="t">蓝色：冻结模块 Frozen</text>
  <rect x="330" y="955" width="28" height="20" class="train"/><text x="370" y="971" class="t">橙色：可训练模块 Trainable</text>
  <rect x="610" y="955" width="28" height="20" class="fusion"/><text x="650" y="971" class="t">绿色：特征融合</text>
  <text x="90" y="1010" class="t">FLUX DiT：提供生成能力与全局一致性</text>
  <text x="90" y="1040" class="t">MM-ControlNet：约束当前 patch，防止凭空生成错误细节</text>
  <text x="90" y="1070" class="t">Restoration LoRA：嵌入 FLUX 内部，一步完成去退化并加速 restoration</text>
</svg>
